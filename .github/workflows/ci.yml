name: CI

# Runs on every push and every pull request. Three jobs:
#   unit-tests  the assignment test cases on Python 3.11 and 3.12 (fast feedback)
#   test        the whole suite with coverage; the run page shows the coverage table
#   docker      the deployment image builds from a clean checkout and starts
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run, so the queue stays short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          # torch/torchvision are deliberately not in requirements.txt: this
          # project runs CPU-only, so they come from the CPU wheel index
          # (the same two-step install CONTRIBUTING.md documents).
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run the assignment unit tests
        run: pytest tests/test_assignment_a2.py -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run the whole test suite with coverage
        run: >
          pytest -v --junitxml=junit.xml
          --cov=app --cov=evaluation --cov=preprocessing --cov=models --cov=training --cov=wsi
          --cov-report=xml --cov-report=term

      - name: Show the coverage table on the run page
        if: always()
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml

  docker:
    # The deployment artifact: build the image from a clean checkout (the React
    # portal is built inside it) and prove the server and every dependency it
    # loads at start-up are present. Model checkpoints are mounted at run time
    # (docs/DEPLOYMENT.md), so the container itself is not started here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t biomarkher2:ci .

      - name: Server code and dependencies import inside the image
        run: |
          docker run --rm --entrypoint python biomarkher2:ci -c "
          import app.server, app.analysis, app.report, app.decision, app.explain, app.review_record, app.field_quality, app.image_io
          import wsi.analysis, wsi.reader, wsi.report, wsi.server_routes
          import training.v2_engine, evaluation.safety_gate
          import openslide, torch, torchvision, sklearn, skimage, reportlab
          import pathlib
          assert pathlib.Path('ui/dist/index.html').is_file(), 'portal was not built into the image'
          print('openslide', openslide.__library_version__, '| torch', torch.__version__)
          "

      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id biomarkher2:ci -u)" != "0"

      - name: Server --help starts without crashing
        run: docker run --rm biomarkher2:ci --help > /dev/null
